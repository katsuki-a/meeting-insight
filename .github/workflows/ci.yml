name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - name: Run checks
        run: Scripts/check.sh
      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks
          path: .artifacts/checks/
