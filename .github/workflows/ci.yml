name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fitness-fast:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - name: Run fast fitness profile
        run: Scripts/fitness.sh fast
      - name: Upload fitness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-fast
          path: .artifacts/fitness/
